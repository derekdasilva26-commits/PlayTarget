<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlayTarget</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 24px; }
      code { background: #f3f3f3; padding: 2px 6px; border-radius: 4px; }
      .ok { color: #0a7a0a; font-weight: 700; }
      .err { color: #a40000; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>PlayTarget</h1>
    <p>Status backend: <span id="status">checando...</span></p>

    <script>
      const API = "http://127.0.0.1:8000";
      fetch(API + "/")
        .then(r => r.text())
        .then(() => document.getElementById("status").textContent = "ONLINE")
        .catch(() => document.getElementById("status").textContent = "OFFLINE");
    </script>
  </body>
</html>
