<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PlayTarget - Comparação de Preços</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: #f3f4f6; 
        }
        #content-container {
            max-width: 700px;
            background: #fff;
            margin: 40px auto 0 auto;
            padding: 32px 32px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px 0 #0001;
        }
        #comparacao-precos { 
            background: #ededed; 
            padding: 1em; 
            border-radius: 8px; 
            margin-bottom: 28px;
        }
        #menor-preco { 
            font-weight: bold; color: #059669;
        }
        h1 { font-size: 2.2em; margin-bottom: 0.2em; letter-spacing: -2px;}
        h2 { color: #343a40; font-size: 1.3em; margin-bottom: 20px; margin-top: 24px;}
        label { font-size: 1em; color: #222; display: block; margin-bottom: 4px;}
        input, button {
            padding: 8px 12px;
            font-size: 1em;
            border: 1px solid #bbb;
            border-radius: 5px;
            outline: none;
        }
        button {
            background: #0099ff;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            border: none;
            margin-top: 12px;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        .status-bar {
            margin-bottom: 32px;
            color: #374151;
        }
        #api-status { font-weight: bold; margin-left: 8px; }
        form { background: #f9fafb; border-radius:6px; padding:18px 12px; margin-bottom: 18px; display: flex; gap: 14px; align-items: center;}
        form button { margin-top: 0;}
        @media (max-width: 600px) {
            #content-container { padding: 14px 4px; }
            form { flex-direction: column; gap: 6px; }
        }
    </style>
</head>
<body>
<div id="content-container">

    <div class="status-bar">
        <span>Status backend:</span>
        <span id="api-status">checando...</span>
    </div>
    
    <h1>PlayTarget</h1>
    <h2>Comparação Automática de Preços de Games</h2>

    <form id="siteForm" autocomplete="off" style="margin-bottom: 15px;">
    <label for="siteName">Nome do Site</label>
    <input id="siteName" placeholder="ex: Steam" required />
    <label for="siteUrl">URL do Site</label>
    <input id="siteUrl" placeholder="https://..." required />
    <button type="submit" style="background-color:#10b981;">Cadastrar Site</button>
</form>

<div id="sitesList" style="margin-bottom:12px;"></div>

   
    <div id="comparacao-precos">
        <strong>Menor preço: <span id="menor-preco"></span></strong><br>
        Maior preço: <span id="maior-preco"></span><br>
        Diferença: <span id="diferenca"></span><br>
        Economia potencial: <span id="economia"></span>
    </div>

    <!-- Botão de atualizar listas-->
    <button onclick="listarSites()" style="background-color:#2563eb;margin-bottom:8px;">Atualizar Sites</button>
<button onclick="listarJogos()" style="background-color:#2563eb;margin-bottom:8px;">Atualizar Jogos</button>

    
    <!-- FORMULÁRIO DE JOGO -->
    <form id="gameForm" autocomplete="off">
        <div style="flex: 1 1 180px; min-width: 120px;">
            <label for="title">Título</label>
            <input id="title" placeholder="Título" required />
        </div>
        <div style="flex: 1 1 140px; min-width: 100px;">
            <label for="genre">Gênero</label>
            <input id="genre" placeholder="Gênero" required />
        </div>
        <div style="flex: 2 1 180px; min-width: 140px;">
            <label for="description">Descrição (opcional)</label>
            <input id="description" placeholder="Descrição (opcional)" />
        </div>
        <button type="submit">Cadastrar Jogo</button>
    </form>

    <div id="gamesList" style="margin-bottom:12px;"></div>

    <!-- Cores de botões-->
    <button type="submit" style="background-color:#2563eb;">Cadastrar Preço</button>

    <!-- FORMULÁRIO DE PREÇO -->
    <form id="priceForm" autocomplete="off">
        <div style="flex: 1 1 110px;">
            <label for="gameId">ID do Jogo</label>
            <input id="gameId" placeholder="ID do Jogo" required />
        </div>
        <div style="flex: 1 1 110px;">
            <label for="siteId">ID do Site</label>
            <input id="siteId" placeholder="ID do Site" required />
        </div>
        <div style="flex: 1 1 110px;">
            <label for="priceValue">Preço</label>
            <input id="priceValue" placeholder="Preço" type="number" step="0.01" required />
        </div>
        <button type="submit">Cadastrar Preço</button>
    </form>

    <!-- SCRIPTS -->
    <script>
    // ================ STATUS DO BACKEND ================
    fetch('http://localhost:8000/health')
      .then(res => res.json())
      .then(data => {
         document.getElementById('api-status').textContent = data.status === 'healthy' ? 'ONLINE' : 'OFFLINE';
      })
      .catch(() => {
         document.getElementById('api-status').textContent = 'OFFLINE';
      });

    // ================ BUSCA DE COMPARAÇÃO ================
    let gameId = 1; // ALTERE conforme sua lógica/listagem

    function buscarComparacao(gameIdValue) {
        fetch(`http://localhost:8000/prices/game/${gameIdValue}/comparison`)
            .then(response => {
                if (!response.ok) { throw new Error('Sem dados'); }
                return response.json();
            })
            .then(dados => {
                document.getElementById('menor-preco').innerText = `R$ ${dados.menor_preco.toFixed(2)} (${dados.site_melhor_preco})`;
                document.getElementById('menor-preco').style.color = '#059669';

                document.getElementById('maior-preco').innerText = `R$ ${dados.maior_preco.toFixed(2)}`;
                document.getElementById('diferenca').innerText = `R$ ${dados.diferenca.toFixed(2)}`;
                document.getElementById('economia').innerText = `R$ ${dados.economia.toFixed(2)}`;
            })
            .catch(() => {
                document.getElementById('comparacao-precos').innerHTML = '<em>Nenhuma comparação disponível para este jogo.</em>';
            });
    }

    // Faz a busca ao carregar a página
    window.onload = function() {
        buscarComparacao(gameId);
    };

    // =============== CADASTRO DE JOGO ======================
    document.getElementById('gameForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const genre = document.getElementById('genre').value;
        const description = document.getElementById('description').value;
        fetch('http://localhost:8000/games/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title, genre, description })
        })
        .then(res => {
            if (res.ok) {
                alert('Jogo cadastrado! Veja o ID no /games ou atualize sua listagem.');
                // Ideal: atualize lista de jogos ou pegue ID recém-cadastrado
            } else {
                return res.json().then(data => { throw new Error(data.detail || 'Erro ao cadastrar jogo'); });
            }
        })
        .catch(err => alert(err.message));
    });

    // =============== CADASTRO DE PREÇO ======================
    document.getElementById('priceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const gameIdValue = document.getElementById('gameId').value;
        const siteId = document.getElementById('siteId').value;
        const price = parseFloat(document.getElementById('priceValue').value);
        fetch('http://localhost:8000/prices/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ game_id: parseInt(gameIdValue), site_id: parseInt(siteId), price: price, currency: 'BRL' })
        })
        .then(res => {
            if (res.ok) {
                alert('Preço cadastrado!');
                buscarComparacao(gameIdValue);
            } else {
                return res.json().then(data => { throw new Error(data.detail || 'Erro ao cadastrar preço'); });
            }
        })
        .catch(err => alert(err.message));
    });
    </script>
</div>
</body>
</html>
