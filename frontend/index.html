<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlayTarget</title>

    <script src="https://cdn.tailwindcss.com">
    </script>
  </head>

  <body class="bg-gray-100 text-gray-900">
    <main class="max-w-5xl mx-auto p-6 space-y-8">
      <header class="bg-white rounded shadow p-6">
        <h1 class="text-3xl font-bold">PlayTarget</h1>
        <p class="mt-2 text-sm">
          Status backend:
          <span id="status" class="font-bold">checando...</span>
        </p>
        <p class="mt-2 text-xs text-gray-500">
          API padrão: <code class="bg-gray-100 px-2 py-1 rounded">http://127.0.0.1:8000</code>
        </p>
      </header>

      <!-- LOGIN / REGISTRO -->
      <section class="bg-white rounded shadow p-6">
        <h2 class="text-2xl font-semibold mb-4">Autenticação</h2>

        <!-- Logged in state -->
        <div id="authLoggedIn" class="hidden flex items-center gap-4">
          <span class="text-green-700 font-semibold">Logado como: <span id="loggedUsername"></span></span>
          <button id="logoutBtn" class="bg-gray-600 text-white px-3 py-1 rounded hover:bg-gray-700">Sair</button>
        </div>

        <!-- Logged out state -->
        <div id="authLoggedOut" class="flex flex-col gap-3 md:flex-row md:items-end md:gap-4">
          <div class="flex flex-col gap-1">
            <label class="text-sm font-medium">Username</label>
            <input id="authUsername" class="border rounded px-3 py-2" placeholder="username" />
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-sm font-medium">Password</label>
            <input id="authPassword" type="password" class="border rounded px-3 py-2" placeholder="senha" />
          </div>
          <div class="flex gap-2">
            <button id="registerBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Registrar</button>
            <button id="loginBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Login</button>
          </div>
          <span id="authMsg" class="text-sm text-red-600"></span>
        </div>
      </section>
        </div>
      </section>

      <section class="bg-white rounded shadow p-6">
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <h2 class="text-2xl font-semibold">Games</h2>
          <button id="refreshGamesBtn" class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">
                 
                Atualizar Lista
          </button>
        </div>
        <form id="gameForm" class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-3">
          <input id="title" class="border rounded px-3 py-2" placeholder="Título" required />

          <input id="genre" class="border rounded px-3 py-2" placeholder="Gênero"/>

          <input id="description" class="border rounded px-3 py-2" placeholder="Descrição(opcional)" />
          <div class="md:col-span-3">
            <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
              Cadastrar jogo
            </button>
          </div>
        </form>
        <div id="gamesList" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

      </section class="bg-white rounded shadow p-6">
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <h2 class="text-2xl font-semibold">Sites</h2>
        <button id="refreshSitesBtn" class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">
           Atualizar Lista
        </button>
      </div>

      <form id="siteForm" class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-3">
  <input id="siteName" class="border rounded px-3 py-2" placeholder="Nome do site (ex: Steam)" required />
  <input id="siteUrl" class="border rounded px-3 py-2" placeholder="URL (https://...)" required />
  <label class="flex items-center gap-2 text-sm">
    <input id="siteActive" type="checkbox" class="h-4 w-4" checked />
    Ativo
  </label>

  <div class="md:col-span-3">
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Cadastrar Site
    </button>
  </div>
</form>

      <div id="sitesList" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <section class="bg-white rounded shadow p-6">

      <div class="flex items-center justify-between gap-4 flex-wrap">
        <h2 class="text-2xl font-semibold">Preços</h2>
        <button id="refreshPriceFormBtn" class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">
          Recarregar jogos/sites
        </button>
      </div>
      <form id="priceForm" class="mt-4 grid grid-cols-1 md:grid-cols-4 gap-3">
  <select id="priceGameId" class="border rounded px-3 py-2" required></select>
  <select id="priceSiteId" class="border rounded px-3 py-2" required></select>

  <input id="priceValue" type="number" step="0.01" min="0"
    class="border rounded px-3 py-2" placeholder="Preço" required />

  <select id="priceCurrency" class="border rounded px-3 py-2">
    <option value="BRL" selected>BRL</option>
    <option value="USD">USD</option>
    <option value="EUR">EUR</option>
  </select>

  <div class="md:col-span-4">
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Cadastrar preço
    </button>
    <span id="priceResult" class="ml-3 text-sm"></span>
  </div>
</form>

      <p class="mt-4 text-sm text-gray-600">
        Dica: para ver preços por jogo, use o botão <b>Ver Preços</b> em cada game na lista.
      </p>
      </section>
      </main>

      <script src="./js/api.js" defer></script>
      </body>
      </html>
