services:
  - type: web
    name: playtarget-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    envVars:
      - key: DB_TYPE
        value: duckdb
      - key: DATABASE_URL
        value: duckdb:///playtarget.duckdb
      - key: SECRET_KEY
        generateValue: true
