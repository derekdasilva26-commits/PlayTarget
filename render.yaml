services:
  - type: web
    name: playtarget-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: DB_TYPE
        value: duckdb
      - key: DATABASE_URL
        value: duckdb:///playtarget.duckdb
      - key: SECRET_KEY
        generateValue: true
